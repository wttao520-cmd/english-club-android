name: Build Android APK

# 云端打包：本机磁盘不足或没有 JDK 17 时，用 GitHub Actions 免费构建
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU 架构（默认 arm64-v8a；老设备选第二项）"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - arm64-v8a, armeabi-v7a
  push:
    branches:
      - main
    tags:
      - "v*"

# 连续推送时只保留最新一次构建，自动取消正在跑的旧任务（省时间、避免抢缓存）
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /opt/microsoft /usr/lib/jvm/temurin-8-jdk-amd64 \
            /usr/lib/jvm/temurin-11-jdk-amd64 /usr/lib/jvm/temurin-21-jdk-amd64 \
            /usr/lib/jvm/temurin-25-jdk-amd64 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            python3-pip
          pip install --upgrade pip
          pip install buildozer cython

      # 缓存 Android SDK/NDK/构建产物：第二次构建从 40 分钟降到约 5 分钟
      - name: Cache buildozer
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Validate spec
        run: |
          # 提前校验 spec，出错时快速失败，避免白等几十分钟
          python3 - <<'PY'
          import configparser
          import re

          valid = {"landscape", "portrait", "landscape-reverse",
                   "portrait-reverse", "all"}
          c = configparser.ConfigParser()
          c.read("buildozer.spec")
          orients = [o.strip() for o in
                     c.get("app", "orientation", fallback="landscape").split(",")]
          bad = [o for o in orients if o not in valid]
          assert not bad, f"orientation 非法值: {bad}，合法值: {sorted(valid)}"
          for k in ("title", "package.name", "version"):
              assert c.get("app", k, fallback=""), f"{k} 缺失"
          # minapi<24 时 Android 头文件不声明 preadv/pwritev，编译 Python 必失败
          minapi = int(c.get("app", "android.minapi", fallback="23"))
          assert minapi >= 24, f"android.minapi={minapi}，必须 >= 24"
          # 不锁定版本会拉到 Python 3.14，与 Kivy 2.3.0 不兼容；
          # 且 hostpython3 必须与 python3 同版本，否则 p4a 直接报错退出
          reqs = c.get("app", "requirements", fallback="")
          assert "python3==" in reqs, "requirements 必须锁定 python3 版本"
          assert "hostpython3==" in reqs, "requirements 必须锁定 hostpython3 版本"
          pv = re.search(r"\bpython3==([\d.]+)", reqs).group(1)
          hv = re.search(r"\bhostpython3==([\d.]+)", reqs).group(1)
          assert pv == hv, f"python3({pv}) 与 hostpython3({hv}) 版本必须一致"
          print("spec 校验通过")
          print("  orientation =", orients, "| minapi =", minapi)
          print("  python3 =", pv, "| hostpython3 =", hv)
          PY

      - name: Build debug APK
        run: |
          # 允许通过手动输入覆盖架构，减少等待时间
          if [ -n "${{ github.event.inputs.arch }}" ]; then
            sed -i "s|^android.archs = .*|android.archs = ${{ github.event.inputs.arch }}|" buildozer.spec
          fi
          grep "^android.archs" buildozer.spec

          # NDK 版本变更后必须清除旧 dist：p4a 匹配 dist 不看 NDK 版本，
          # 会直接复用旧 NDK 编译的产物（例如 r25b 的 4KB 对齐 .so）。
          # 清除后 p4a 用当前 NDK 全量重编（首次约 30~40 分钟）。
          rm -rf .buildozer/android/platform/build-arm64-v8a
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          df -h /

          # 日志完整保存；失败时打印关键行。
          # 注意 PIPESTATUS：管道是 yes|buildozer|tee 三段，
          #   [0]=yes(被 SIGPIPE 杀死恒为 141)，[1]=buildozer 才是真正要的退出码
          set +e
          yes 2>/dev/null | buildozer -v android debug 2>&1 | tee build.log
          code=${PIPESTATUS[1]}
          set -e
          echo "===== buildozer exit code = $code ====="
          df -h /

          if [ "$code" -ne 0 ]; then
            echo ""
            echo "########## 关键错误摘要 ##########"
            grep -n -iE "error:|fatal error|error \[|Command failed|Build failed|Buildozer failed|Error compiling|FAILURE:|No space left|not found|Exception in thread" build.log \
              | grep -viE "ignored|warning|test_|_exceptions|_test|\.pxi|\.py'|fake_" | tail -35
            echo "########## 摘要结束，完整日志见 Artifacts: build-log ##########"
            exit "$code"
          fi

          echo "===== bin/ 产物 ====="
          ls -la bin/

          # Android 15+/16 的 16KB 页设备校验：每个 .so 的最大 PT_LOAD p_align
          # 必须 >= 0x4000 (16KB)。用 Python 标准库直接解析 ELF，不依赖外部工具。
          echo "===== 16KB page alignment check ====="
          python3 - <<'PY'
          import glob, struct, zipfile

          apk = sorted(glob.glob("bin/*.apk"))[0]
          z = zipfile.ZipFile(apk)
          sos = [n for n in z.namelist()
                 if n.startswith("lib/") and n.endswith(".so")]
          assert sos, "APK 中没有 .so"

          bad = []
          for name in sos:
              d = z.read(name)
              if d[:4] != b"\x7fELF":
                  # p4a 把 Python 代码包打成 tar 并命名为 libpybundle.so 放入 lib/，
                  # 运行时由 PythonUtil.unpackPyBundle 解包，不是 ELF、不参与 mmap，无需对齐
                  print("SKIP", name, "(非 ELF: p4a python bundle tar)")
                  continue
              assert d[4] == 2, f"{name}: 非 64 位 ELF"
              phoff = struct.unpack_from("<Q", d, 0x20)[0]
              phentsize = struct.unpack_from("<H", d, 0x36)[0]
              phnum = struct.unpack_from("<H", d, 0x38)[0]
              best = 0
              for i in range(phnum):
                  off = phoff + i * phentsize
                  if struct.unpack_from("<I", d, off)[0] == 1:  # PT_LOAD
                      align = struct.unpack_from("<Q", d, off + 0x30)[0]
                      best = max(best, align)
              ok = best >= 0x4000
              print(("OK  " if ok else "FAIL"), name, hex(best))
              if not ok:
                  bad.append(name)

          if bad:
              raise SystemExit(
                  f"{len(bad)} 个 .so 不是 16KB 对齐，Android 15+/16 设备会闪退！")
          print(f"全部 {len(sos)} 个 .so 满足 16KB 对齐")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: english-club-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      # 无论成功失败都保留完整日志，便于定位被界面截断的错误
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Show result
        if: always()
        run: ls -la bin/ 2>/dev/null || echo "bin/ 下没有产物，请查看上方日志"
